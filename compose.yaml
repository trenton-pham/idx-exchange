services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: idx
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: housing
    ports: ['127.0.0.1:55432:5432']
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U idx -d housing']
      interval: 2s
      timeout: 2s
      retries: 15
volumes:
  postgres-data:
