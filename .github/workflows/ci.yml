name: Validate
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-test-only
          POSTGRES_DB: housing_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://postgres:synthetic-test-only@127.0.0.1:5432/housing_test
      DATABASE_URL: postgresql://postgres:synthetic-test-only@127.0.0.1:5432/housing_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json}
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: cfn-lint infra/foundation.yaml infra/application.yaml
      - run: python -m scripts.export_openapi
      - run: npm ci --prefix web
      - run: npm run types --prefix web
      - run: git diff --exit-code backend/openapi.json web/src/api-types.ts
      - run: npm run build --prefix web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: python -m backend.seed_demo
      - run: python -m uvicorn backend.app:app --host 127.0.0.1 --port 8000 > /tmp/housing-api.log 2>&1 &
      - run: npm test --prefix web
      - uses: actions/upload-artifact@v4
        if: failure()
        with: {name: browser-test-results, path: web/test-results, retention-days: 7}
